name: healthy_spirit
description: "Healthy Spirit — приложение для здорового питания."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  fl_chart: ^1.3.1
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  cupertino_ui: ^1.1.7
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon/icon.png"
  adaptive_icon_background: "#0F1A12"
  adaptive_icon_foreground: "assets/images/icon/icon.png"